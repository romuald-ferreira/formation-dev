<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <p>Ceci est un paragraphe texte.</p>
      <strong>Ceci est un texte en gras. </strong>
      <em>Ceci est un texte en italique.</em>
      <br />

      <ul>
        <li>Item ul 1</li>
        <li>Item ul 2</li>
        <li>Item ul 3</li>
      </ul>

      <ol>
        <li>Item ol 1</li>
        <li>Item ol 2</li>
        <li>Item ol 3</li>
      </ol>
      <aside>
        <p>Ceci est un aside.</p>
      </aside>
      <figure>
        <img src="reussi.jpg" alt="Description de l'image" loading="lazy" />
        <figcaption>Crédit : Romuald FERREIRA</figcaption>
      </figure>
      <blockquote>
        <p>Ceci est une citation.</p>
      </blockquote>
      <table>
        <tr>
          <th>En-tête 1</th>
          <th>En-tête 2</th>
        </tr>
        <tr>
          <td>Donnée 1</td>
          <td>Donnée 2</td>
        </tr>
      </table>
    </main>
  </body>
</html>
